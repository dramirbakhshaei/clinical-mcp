name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run pytest --cov=src/clinical_mcp/engines --cov-fail-under=95
      - run: uv run ruff check src/clinical_mcp
      - run: uv run mypy src/clinical_mcp
