[project]
name = "clinical-mcp"
version = "0.2.0"
description = "Open Clinical AI Lab - deterministic clinical calculators exposed as MCP tools"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Amir Bakhshaei, MD" }]
dependencies = [
    "mcp[cli]>=1.2.0",
    "pydantic>=2.9.0",
    "rich>=13.9.0",
]

[project.scripts]
clinical-mcp = "clinical_mcp.server:main"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clinical_mcp"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--cov=src/clinical_mcp/engines --cov-report=term-missing --cov-fail-under=95"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# The formatter never splits long string literals; E501 stays off for those.
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
packages = ["clinical_mcp"]
mypy_path = "src"
